name: Build AIT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ait:
    name: Build AIT file
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AIT
        run: npm run build

      - name: Collect AIT file
        shell: pwsh
        run: |
          $aitFiles = Get-ChildItem -Path . -Recurse -File -Filter *.ait |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }

          if (-not $aitFiles) {
            throw 'AIT build completed, but no .ait file was found.'
          }

          New-Item -ItemType Directory -Path ait-output -Force | Out-Null
          $aitFiles | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination ait-output -Force
          }

          Write-Host "Collected $($aitFiles.Count) AIT file(s)."
          $aitFiles | ForEach-Object { Write-Host $_.FullName }

      - name: Upload AIT artifact
        uses: actions/upload-artifact@v4
        with:
          name: card-forge-ait
          path: ait-output/*.ait
          if-no-files-found: error
          retention-days: 14
